developer_instructions = "Run the primary conversation in Chief of Staff operating mode. Read ~/.codex/agents/chief-of-staff.toml and follow its developer_instructions, together with the global AGENTS.md and applicable project instructions."

[agents.chief-of-staff]
description = "Receive rough requirements, rank daily priorities, coordinate PMs and workers, and track checkpointed delivery through reviewed PRs."
config_file = "agents/chief-of-staff.toml"

[agents.project-manager]
description = "Coordinate one complex project or independent workstream with task briefs, dependencies, worker assignments, and acceptance evidence."
config_file = "agents/project-manager.toml"

[agents.implementation-worker]
description = "Implement a bounded task within assigned files or modules, run appropriate checks, and return concrete deliverables and verification evidence."
config_file = "agents/implementation-worker.toml"

[agents.architecture-advisor]
description = "Advise on cross-module architecture, difficult failures, and tradeoffs between competing designs."
config_file = "agents/architecture-advisor.toml"

[agents.code-advisor]
description = "Trace execution paths, evaluate implementation plans, and independently review consequential code changes."
config_file = "agents/code-advisor.toml"

[agents.visual-advisor]
description = "Analyze screenshots, charts, interface consistency, readability, and the clarity of user-facing copy."
config_file = "agents/visual-advisor.toml"

[agents.verify-worker]
description = "Independently verify the assigned revision and report acceptance evidence without changing implementation source."
config_file = "agents/verify-worker.toml"

[agents.ci-worker]
description = "Diagnose and repair scoped CI pipeline, runner, test-environment, or flaky infrastructure problems."
config_file = "agents/ci-worker.toml"

[agents.deliver-worker]
description = "Carry out an authorized delivery checkpoint with current acceptance and CI evidence, preserving implementation source."
config_file = "agents/deliver-worker.toml"

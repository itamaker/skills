[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webpage2pdf"
version = "0.2.0"
description = "Webpage to paginated PDF via headless Chrome (pixel-exact screenshots or selectable-text print), bundled as a standalone Claude Code skill"
license = { text = "MIT" }
authors = [{ name = "Zhaoyang Jia", email = "zhaoyang.jia@ieee.org" }]
requires-python = ">=3.9"
dependencies = [
    "selenium>=4.6",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/itamaker/skills"
Issues = "https://github.com/itamaker/skills/issues"

[project.scripts]
webpage2pdf = "webpage2pdf.cli:main"

[tool.setuptools]
packages = ["webpage2pdf"]
